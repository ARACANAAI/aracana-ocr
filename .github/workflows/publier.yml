# Publication par « Trusted Publishing » — aucun jeton nulle part.
#
# POURQUOI CETTE VOIE PLUTÔT QU'UN JETON D'API
#   Un jeton PyPI est un secret de longue durée, copié dans les réglages du
#   dépôt, visible de quiconque a les droits d'administration, et valable
#   jusqu'à révocation manuelle. Le Trusted Publishing le remplace par un
#   jeton OIDC à usage unique, émis par GitHub pour CE dépôt, CE workflow et
#   CET environnement, valable quelques minutes.
#
#   Rien à stocker, rien à faire fuiter, rien à faire tourner.
#
# CE QU'IL FAUT DÉCLARER UNE FOIS, CÔTÉ PyPI
#   test.pypi.org puis pypi.org → Your projects → Publishing → Add a new
#   pending publisher :
#       PyPI Project Name : aracana-ocr
#       Owner             : ARACANAAI
#       Repository name   : aracana-ocr
#       Workflow name     : publier.yml
#       Environment name  : testpypi   (puis pypi)
#
#   « Pending publisher » signifie que le projet n'a pas encore besoin
#   d'exister : le premier envoi le crée.
#
# SI VOUS N'AVEZ PAS DE COMPTE TestPyPI
#   TestPyPI est un filet, pas un passage obligé. Réglez la variable de dépôt
#   SANS_TESTPYPI à « true » (Settings → Secrets and variables → Actions →
#   Variables) : l'étape est sautée et la publication sur PyPI continue.
#
#   Un saut n'est pas un échec — mais un ÉCHEC de TestPyPI, lui, arrête tout.
#   Retirez la variable dès que le compte existe : le filet reprend son rôle.

name: Publier

on:
  push:
    tags: ["v*"]          # v0.1.0 déclenche TestPyPI puis PyPI
  workflow_dispatch:      # essai manuel, TestPyPI seulement

jobs:
  construire:
    name: Construire et vérifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier que la version du tag correspond au paquet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Publier un tag v0.2.0 avec un pyproject à 0.1.0 produirait une
          # version PyPI qui ne correspond à aucun commit. Sur un dépôt où
          # rien ne se reprend, c'est irréparable.
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$TAG  pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Le tag et pyproject.toml divergent."; exit 1; }

      - name: Suites de tests
        run: |
          # Le paquet n'a aucune dépendance obligatoire : les suites du cœur
          # doivent passer sur une installation nue. Si elles échouent ici,
          # c'est qu'une dépendance s'est glissée sans être déclarée.
          pip install -e ".[pdf]"
          for t in tests/test_*.py; do
            echo "── $t"
            python "$t" || exit 1
          done

      - name: Construire
        run: |
          pip install build
          python -m build --outdir dist .

      - name: Contrôler les artefacts
        run: |
          pip install twine
          twine check dist/*
          # Une roue qui ne s'installe pas dans un environnement vierge est
          # une roue cassée, et on ne le découvre qu'après publication.
          python -m venv /tmp/vierge
          /tmp/vierge/bin/pip install dist/*.whl
          /tmp/vierge/bin/python -c "import aracana; print(aracana.__version__)"
          /tmp/vierge/bin/aracana pro
          # Et l'archive source, séparément. `pip install` depuis un index
          # préfère la roue : un fichier absent de la sdist ne se voit donc
          # jamais, jusqu'au jour où quelqu'un construit depuis les sources.
          # Ce contrôle ne dépend d'aucun compte TestPyPI — c'est ce qui rend
          # le filet TestPyPI facultatif sans rendre la publication aveugle.
          python -m venv /tmp/vierge_sdist
          /tmp/vierge_sdist/bin/pip install --no-binary :all: dist/*.tar.gz
          /tmp/vierge_sdist/bin/python -c "import aracana; print(aracana.__version__)"
          /tmp/vierge_sdist/bin/aracana --sans-couleur pro

      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: dist/

  testpypi:
    name: TestPyPI
    needs: construire
    # Sauté sur demande explicite. `verifier_testpypi` en dépend et se saute
    # donc avec lui, sans condition à répéter.
    if: vars.SANS_TESTPYPI != 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aracana-ocr
    permissions:
      id-token: write        # le jeton OIDC ; aucun secret de dépôt
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # La répétition à blanc (workflow_dispatch) publie déjà 0.1.0 sur
          # TestPyPI. L'envoi suivant, celui de l'étiquette, retomberait sur
          # « File already exists » et bloquerait la chaîne AVANT PyPI : la
          # répétition sabordait la vraie publication.
          #
          # On tolère donc le doublon ICI, et seulement ici. Sur PyPI il doit
          # rester une erreur franche — un doublon silencieusement ignoré
          # laisse croire qu'on a publié alors qu'on n'a rien envoyé.
          skip-existing: true

  verifier_testpypi:
    name: Installer depuis TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer et exécuter
        run: |
          # L'étape qui vaut le détour par TestPyPI : on installe le paquet
          # TEL QUE PUBLIÉ, depuis l'index, comme le fera un utilisateur.
          # Une métadonnée fautive ou un fichier manquant se voit ici, où
          # l'erreur est encore gratuite.
          # Sur un essai manuel il n'y a pas de tag : `GITHUB_REF_NAME` vaut
          # le nom de la branche, et « aracana-ocr==main » échouerait
          # systématiquement. On n'épingle la version que sur un tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CIBLE="aracana-ocr==${GITHUB_REF_NAME#v}"
          else
            CIBLE="aracana-ocr"
          fi
          echo "installation de $CIBLE"
          for i in 1 2 3 4 5 6; do
            pip install --index-url https://test.pypi.org/simple/ \
                        --extra-index-url https://pypi.org/simple/ \
                        "$CIBLE" && break
            echo "index pas encore à jour, nouvelle tentative…"; sleep 20
          done
          python -c "
          import aracana
          from aracana import decider, Client, JournalAudit, plugins, pro
          from aracana.riskcov import courbe
          from aracana.agent import reparer
          print('aracana-ocr', aracana.__version__, 'installé depuis TestPyPI')
          "
          aracana --sans-couleur pro

  pypi:
    name: PyPI
    needs: [construire, verifier_testpypi]
    # Par défaut, une étape sautée saute aussi celles qui en dépendent : sans
    # `always()`, désactiver TestPyPI désactiverait silencieusement PyPI.
    # D'où la distinction explicite entre « sauté » et « échoué » :
    #   construire         doit avoir RÉUSSI  — sinon il n'y a pas d'artefact
    #   verifier_testpypi  ne doit pas avoir ÉCHOUÉ — « skipped » est accepté
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.construire.result == 'success'
      && needs.verifier_testpypi.result != 'failure'
      && needs.verifier_testpypi.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: pypi                 # protégez-le par une revue manuelle :
      url: https://pypi.org/p/aracana-ocr   # Settings → Environments → Required reviewers
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
